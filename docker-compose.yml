services:
  postgres:
    image: postgres:16-alpine
    container_name: qa_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_operator}
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa_user} -d ${POSTGRES_DB:-qa_operator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_api
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-qa_operator}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      REPORT_BASE_URL: ${REPORT_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    volumes:
      - ./reports:/app/reports

volumes:
  postgres_data:
