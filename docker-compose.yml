services:
  postgres:
    image: postgres:16-alpine
    container_name: qa_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qa_operator}
      POSTGRES_USER: ${POSTGRES_USER:-qa_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be explicitly provided}"
    ports:
      # Bound to localhost only to prevent public network exposure.
      # For production with internal-only API access, this port mapping can be removed.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qa_user} -d ${POSTGRES_DB:-qa_operator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_api
    restart: always
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-qa_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}@postgres:5432/${POSTGRES_DB:-qa_operator}"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_KEY: ${API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      REPORT_BASE_URL: ${REPORT_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    volumes:
      - ./reports:/app/reports

volumes:
  postgres_data:
